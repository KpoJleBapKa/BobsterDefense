# ═══════════════════════════════════════════════
#   BobsterDefence — конфігурація
# ═══════════════════════════════════════════════

config-version: 3

# Захист скринь від вибухів.
# Блокує ТІЛЬКИ руйнування вибухом. Ламати руками/киркою можна як завжди.
chest-protection:
  enabled: true
  chest: true
  trapped-chest: true
  # Додаткові типи блоків, які теж не мають руйнуватися вибухом.
  # Приклад: [BARREL, SHULKER_BOX, ENDER_CHEST]
  extra-blocks: []

# Ручне ППО: перехоплення цілей стрілою з лука.
air-defence:
  enabled: true

  intercept-tnt: true       # збивати активований TNT (TNTPrimed)
  intercept-drones: true    # збивати ворожі FPV-дрони
  intercept-missiles: true  # збивати балістичні ракети (складніше: треба кілька влучань)

  # Які снаряди можуть збивати ціль
  projectiles:
    arrow: true            # звичайні + tipped (зіллєві) стріли
    spectral-arrow: true   # spectral arrow
    trident: false         # тризуб
    # Все інше (сніжки, яйця, феєрверки, вогняні кулі) ніколи не збиває ціль.

  # Прибирати стрілу після перехоплення
  remove-arrow: true

  # Скільки тіків залишити до вибуху TNT після влучання (мінімум 1)
  instant-fuse-ticks: 1

  # Шанс перехоплення у відсотках (100 = завжди)
  chance-percent: 100

  # Зараховувати перехоплення, якщо стріляв не гравець (скелет, роздавач)
  count-non-player-shooters: false

  effects:
    particles: true
    particle: ELECTRIC_SPARK   # напр. CRIT, ELECTRIC_SPARK, FLASH, EXPLOSION
    particle-count: 30
    particle-offset: 0.4
    sound: true
    sound-name: ENTITY_FIREWORK_ROCKET_BLAST
    sound-volume: 1.0
    sound-pitch: 1.4
    actionbar: true

# ═══════════════════════════════════════════════
#   FPV-дрони
# ═══════════════════════════════════════════════
#
# Як це працює технічно: на Paper 1.21.1 немає API для читання WASD/Space/Shift
# (PlayerInputEvent з'явився пізніше), тому оператор на час польоту переводиться
# в spectator — там ці клавіші працюють нативно, а миша задає напрямок.
# Гравець фактично і є камерою дрона; сутності дрона щотік підтягуються за ним,
# а зіткнення рахуються ray trace'ом між позиціями двох сусідніх тіків.
fpv-drone:
  enabled: true
  recipes-enabled: true

  explosion-fire: false
  explosion-break-blocks: true

  # Сила вибуху дрона, збитого в повітрі (ППО, стріла, таран).
  # Не залежить від моделі: збитий дрон детонує повним боєкомплектом.
  intercept-explosion-power: 4.0

  explode-on:
    blocks: true
    players: true
    entities: true

  operator:
    # Тіло оператора лишається на місці запуску і залишається вразливим.
    # Якщо його вб'ють — дрон миттєво детонує.
    can-take-damage: true

  # На якій відстані спрацьовує таран чужого дрона. Окремо від зіткнення з блоками:
  # hitbox дрона — маленька невидима стійка, і влучити в неї променем на льоту нереально.
  ram-radius: 2.0

  # Розмір моделі дрона (1.0 = повний блок)
  model-scale: 0.6
  # Витрачати предмет у креативі
  consume-in-creative: true
  glow: true

  effects:
    particles: true
    sounds: true
    actionbar: true

  # Постійне гудіння дрона в польоті. Чути і оператору, і тим, над ким він летить.
  sound:
    enabled: true
    name: ENTITY_BEE_LOOP
    volume: 1.0
    pitch: 1.6
    interval-ticks: 10

  drones:
    # ── Важкий ударний ─────────────────────────────────────────
    fp1:
      name: "<gold><bold>🛩 FPV-ДРОН «FP-1»</bold></gold>"
      material: TNT
      speed: 0.75            # важкий, розігнатися не може
      # boost-speed = speed → Ctrl нічого не дає: у FP-1 прискорення немає взагалі
      boost-speed: 0.75
      max-distance: 1500
      flight-time: 240
      explosion-power: 5.0
      player-damage: 0       # без протипіхотного бонусу — тут працює сам вибух
      player-damage-radius: 0
      lore:
        - "<dark_gray>Важкий ударний дрон."
        - ""
        - "<gray>📡 Дальність: <white>{distance}</white> блоків"
        - "<gray>🔋 Час польоту: <white>{time}</white>с"
        - "<gray>💥 Потужність: <white>{power}</white>"
        - ""
        - "<gray>▶ <white>ПКМ</white> — запустити"
        - "<gray>⌨ <white>WASD</white> — керування"
        - "<gray>␣ <white>Space / Shift</white> — висота"
        - "<red>⚠ Прискорення (Ctrl) недоступне"
        - "<red>⚠ Одноразове використання"
      recipe:
        shape:
          - " P "
          - "RTR"
          - "ISI"
        ingredients:
          P: PHANTOM_MEMBRANE
          R: REDSTONE
          T: TNT
          I: IRON_INGOT
          S: SPYGLASS

    # ── Протипіхотний ──────────────────────────────────────────
    p1sun:
      name: "<yellow><bold>🛩 FPV-ДРОН «P1-Sun»</bold></yellow>"
      material: TNT
      speed: 2.0             # найшвидший з трьох
      boost-speed: 2.8
      max-distance: 500
      flight-time: 60
      explosion-power: 1.0   # майже не чіпає забудову
      player-damage: 80
      player-damage-radius: 4
      lore:
        - "<dark_gray>Легкий протипіхотний дрон."
        - ""
        - "<gray>📡 Дальність: <white>{distance}</white> блоків"
        - "<gray>🔋 Час польоту: <white>{time}</white>с"
        - "<gray>💥 По блоках: <white>{power}</white>"
        - "<red>🩸 По гравцях: <white>{damage}</white> шкоди"
        - ""
        - "<gray>Забудову майже не руйнує."
      recipe:
        shape:
          - " D "
          - "ITI"
          - "RGR"
        ingredients:
          D: DIAMOND
          I: IRON_INGOT
          T: TNT
          R: REDSTONE
          G: GUNPOWDER

    # ── Середній ───────────────────────────────────────────────
    d1lduck:
      name: "<white><bold>🛩 FPV-ДРОН «D1L-Duck»</bold></white>"
      material: TNT
      speed: 2.0
      boost-speed: 2.0
      max-distance: 1000
      flight-time: 120
      explosion-power: 2.5
      player-damage: 0
      player-damage-radius: 0
      lore:
        - "<dark_gray>Середній ударний дрон."
        - ""
        - "<gray>📡 Дальність: <white>{distance}</white> блоків"
        - "<gray>🔋 Час польоту: <white>{time}</white>с"
        - "<gray>💥 Потужність: <white>{power}</white>"
      recipe:
        shape:
          - " D "
          - "ITI"
          - "GIG"
        ingredients:
          D: DIAMOND
          I: IRON_INGOT
          T: TNT
          G: GUNPOWDER

# ═══════════════════════════════════════════════
#   Балістичні установки
# ═══════════════════════════════════════════════
#
# Установка — це DISPENSER із міткою рівня в PDC самого блока.
# ПКМ по ній відкриває панель керування, присів+ПКМ — відсік для ракет.
#
# Боєприпас — окрема крафтова ракета. Усі бойові характеристики (дальність, сила,
# перезарядка, швидкість) належать саме ракеті й виписані в її lore.
#
# Наведення:
#   1) /ballistic target <x> <z>  або  /ballistic target here
#   2) кнопка «ЦІЛЬ» на панелі — режим розвідки з видом згори
#   3) присів + ПКМ по filled map у рамці на стіні
#
# Важливо про потужність: 4.0 ≈ один звичайний TNT. Радіус вибуху росте нелінійно,
# тому найважча ракета — 8.0, а не 4×5=20. Інакше один постріл зносив би пів бази.
drone-launcher:
  trajectory:
    height-above-target: 40.0
    lane-offset: 3.0
    lane-reset-seconds: 2.0

missile-payload:
  potion:
    radius-per-power: 3.0
    minimum-intensity: 0.25
  empty:
    burn-seconds: 15.0
    smoke-seconds: 60.0

guided-missile:
  enabled: true
  launch-protection-seconds: 2.0
  launch-control-delay-seconds: 0.5
  flight:
    physics-reference-speed: 0.9
    engine-response: 0.12
    steering-response: 0.055
    powered-climb-min-speed-multiplier: 0.65
    powered-dive-max-speed-multiplier: 1.3
  chunk-loading:
    look-ahead-seconds: 3.0
    client-ready-distance: 48.0
    send-view-distance: 10
    unready-speed-multiplier: 0.2
    recovery-step: 0.08
    slowdown-step: 0.2
  types:
    corsair:
      name: "<aqua><bold>🚀 Corsair guided missile</bold>"
      fuel-seconds: 15.0
      explosion-power: 5.0
      hits-to-intercept: 1
      cooldown-seconds: 0
      speed: 3.0
      lore:
        - "<gray>Крилата керована ракета для Rocket launch system."
        - ""
        - "<gray>⛽ Пальне: <white>{fuel}</white> с"
        - "<gray>📡 Дальність: <white>без обмежень</white>"
        - "<gray>💥 Потужність: <white>{power}</white>"
        - "<gray>🛡 Збиття ППО: <white>{hits}</white> влучання"
        - "<gray>⚡ Швидкість: <white>{speed}</white> блока/тік"
    barrier:
      name: "<gold><bold>🚀 Barrier guided missile</bold>"
      fuel-seconds: 30.0
      explosion-power: 7.0
      hits-to-intercept: 1
      cooldown-seconds: 0
      speed: 3.6
      lore:
        - "<gray>Далекобійна крилата керована ракета."
        - ""
        - "<gray>⛽ Пальне: <white>{fuel}</white> с"
        - "<gray>📡 Дальність: <white>без обмежень</white>"
        - "<gray>💥 Потужність: <white>{power}</white>"
        - "<gray>🛡 Збиття ППО: <white>{hits}</white> влучання"
        - "<gray>⚡ Швидкість: <white>{speed}</white> блока/тік"

ballistic:
  enabled: true
  recipes-enabled: true

  rocket-camera:
    enabled: true
    waiting-timeout-seconds: 300

  # Затримка перед пуском, секунд (3... 2... 1... ПУСК)
  countdown-seconds: 3

  # Звук відліку — навмисно глухий і низький, щоб не сперечався зі звуком пуску
  countdown-sound:
    name: BLOCK_NOTE_BLOCK_BASEDRUM
    volume: 1.0
    pitch: 0.55

  # Плашка над установкою видима лише зблизька.
  # Клієнт множить це на свій повзунок «Entity Distance», тож на 50% зникне вдвічі ближче.
  hologram-distance: 3

  explosion-fire: false
  explosion-break-blocks: true

  trajectory:
    minimum-height: 60      # мінімальна висота дуги над хордою
    height-per-block: 0.18  # приріст висоти на кожен блок дистанції
    maximum-height: 220     # стеля дуги
    speed: 3.0              # базова швидкість, якщо у ракети не задана своя
    detonate-on-terrain: true  # підрив, якщо дуга зачепила гору по дорозі

  # Корпус ракети — сутність Trident, яка рухається швидкістю та ванільно повертається за напрямком польоту.
  missile:
    # Старт має однакову фізичну довжину та швидкість за будь-якої дальності цілі.
    launch-distance-blocks: 8.0
    ascent-phase: 0.35
    ballistic-phase: 0.70
    interception-grace-ticks: 60

    # Множники швидкості відносно швидкості ракети: старт повільніший, пікірування швидше.
    # Вище 1.3 піднімати не варто: у найшвидшої ракети (3.0) це дає рівно 3.9 бл/тік —
    # межу, яку витримує пакет швидкості. За нею клієнт починає відставати від сервера.
    launch-speed-multiplier: 0.2
    ascent-speed-multiplier: 0.75
    descent-speed-multiplier: 1.3

    # Радіус, у якому зараховується удар. У пікіруванні ракета проходить кілька блоків
    # за тік, тож без цього вона могла б просто проскочити точку удару.
    impact-radius: 2.5

    # Запобіжник: політ довше цього часу завершується підривом (ракета не «зависає» назавжди)
    max-flight-time-seconds: 120

    # Ракета сама тримає завантаженими чанки під собою і попереду по курсу.
    # Без цього постріл на кілька кілометрів іде в незавантажений світ — сутність там
    # просто перестає існувати, і замість удару виходить тиша.
    # Пройдені чанки звільняються одразу, тому слід із завантаженого світу за ракетою
    # не тягнеться. Чим більший radius і look-ahead — тим більше навантаження на сервер.
    chunk-loading:
      enabled: true
      radius: 1          # 1 = квадрат 3×3 чанки навколо точки
      look-ahead: 48     # на скільки блоків уперед по курсу дивитися (48 = 3 чанки)
      start-hold-seconds: 30  # чанк установки тримається від команди пуску й повторно від фактичного старту

    # Реактивний слід — малюється ПОЗАДУ ракети вздовж вектора руху.
    # Частинки надсилаються з прапорцем «показувати здалеку»: інакше клієнт малює їх
    # лише за 32 блоки, і сліду ракети на висоті 150+ не було б видно з землі взагалі.
    exhaust:
      enabled: true
      flame-count: 6
      smoke-count: 3
      trail-length: 1.5    # довжина факела в блоках
      trail-points: 3      # на скільки точок він розбитий
      interval-ticks: 1

    # Звук двигуна в польоті.
    # УВАГА: гучність тут — це насамперед ДАЛЬНІСТЬ. Minecraft роздає звук гравцям
    # у радіусі volume × 16 блоків, гучнішим за 1.0 він уже не стає. 6.0 ≈ 96 блоків.
    sound:
      enabled: true
      name: ENTITY_BLAZE_SHOOT
      volume: 6.0
      pitch: 0.7
      interval-ticks: 8

    # Потужний факел і дим у момент пуску
    launch-effect: true

    # Звук пуску. Два шари феєрверка одночасно: низький «пуск» дає тіло звуку,
    # верхній «розрив» — різкість. Гучність вища за звичайну, щоб старт було чути здалеку.
    # 12.0 ≈ 192 блоки: пуск має бути чутно з сусідньої бази.
    launch-sound:
      enabled: true
      name: ENTITY_FIREWORK_ROCKET_LAUNCH
      volume: 12.0
      pitch: 0.5
      blast-name: ENTITY_FIREWORK_ROCKET_BLAST
      blast-volume: 10.0
      blast-pitch: 0.6

  # Перехоплення: ракета підривається в повітрі.
  # Сила береться з airburst-power конкретної ракети (див. launcher нижче).
  interception:
    fire: false
    # true — збита біля землі ракета лишає слід на місцевості. Так реалістичніше:
    # боєголовка нікуди не поділася, вона просто спрацювала не там, де цілилися.
    break-blocks: true

  warning:
    enabled: true
    radius: 250
    # true — повідомляти точні координати удару, false — лише «у вашому районі»
    exact-coords: true

  effects:
    particles: true
    sounds: true

  # Розвідувальний дрон установки.
  # Не камікадзе: злітає, оглядає місцевість і має ПОВЕРНУТИСЯ на базу.
  # Стаціонарна ППО його не бачить, але стріла з лука чи чужий FPV — цілком.
  recon:
    enabled: true
    # Час польоту, секунд
    flight-time: 600
    # Швидкість (як у P1-Sun)
    speed: 1.3
    # Висота, на якій розвідник з'являється над установкою
    launch-height: 5.0
    # Повернення = посадка на саму установку: зависнути над її блоком і опуститися.
    # Радіус по горизонталі й допустима висота над установкою.
    landing-radius: 1.5
    landing-height: 2.5
    # Скільки секунд після зльоту посадка ще не зараховується
    # (інакше розвідник «сідав» би одразу, бо злітає з тієї ж установки)
    return-delay-seconds: 5
    # Штрафна перезарядка установки, якщо розвідник не повернувся, хвилин
    lost-cooldown-minutes: 30
    # Дальність вибору блока. Велика навмисно: з висоти до землі далеко.
    target-range: 512
    # Міцність. Розвідник не вибухає об рельєф, як FPV, — він втрачає серце
    # і його відкидає назад. Скінчилися серця — апарат розбито.
    hearts: 5
    # Пауза між ударами, тіків: без неї одне влітання в стіну з'їло б усі серця одразу
    hit-cooldown-ticks: 10
    # Тихіше за бойові дрони — розвідник має бути непомітнішим
    sound:
      enabled: true
      name: ENTITY_BEE_LOOP
      volume: 0.35
      pitch: 1.9
      interval-ticks: 15
    # Модель: стійка з бронею, завалена на 90°
    visible-stand: true
    chestplate: CHAINMAIL_CHESTPLATE

  launcher:
    fp5:
      level: 1
      name: "<gray><bold>🚀 FP-5 launch system</bold></gray>"
      range: 500
      ammo: 1
      explosion-power: 4.0
      hits-to-intercept: 1
      airburst-power: 5.0        # вибух, якщо ракету збили в повітрі
      cooldown-seconds: 10
      speed: 2.1                  # на 30% повільніше за базову
      loses-control-when-hit: false
      lore:
        - "<dark_gray>Легка тактична установка."
        - ""
        - "<gray>📡 Дальність: <white>{range}</white> блоків"
        - "<gray>💥 Потужність: <white>{power}</white>"
        - "<gray>⏱ Перезарядка: <white>{cooldown}</white>с"
        - ""
        - "<gray>ПКМ — панель керування"
        - "<gray>Присів+ПКМ — відсік для ракет"
      rocket:
        name: "<gray><bold>🚀 FP-5 rocket</bold></gray>"
        lore:
          - "<dark_gray>Боєприпас для {launcher}."
          - ""
          - "<gray>📡 Дальність: <white>{range}</white> блоків"
          - "<gray>💥 Потужність: <white>{power}</white>"
          - "<gray>🛡 Збиття ППО: <white>{hits}</white> влучання"
          - "<gray>⏱ Перезарядка: <white>{cooldown}</white>с"
        recipe:
          amount: 1
          shape:
            - " I "
            - "ITI"
            - "IRI"
          ingredients:
            I: IRON_INGOT
            T: TNT
            R: REDSTONE
      recipe:
        shape:
          - "IRI"
          - "RDR"
          - "IPI"
        ingredients:
          I: IRON_INGOT
          R: REDSTONE
          D: DISPENSER
          P: REDSTONE_BLOCK

    satan:
      level: 2
      name: "<white><bold>🚀 Satan launch system</bold></white>"
      range: 1000
      ammo: 1
      explosion-power: 5.0
      hits-to-intercept: 1
      airburst-power: 6.0        # вибух, якщо ракету збили в повітрі
      cooldown-seconds: 20

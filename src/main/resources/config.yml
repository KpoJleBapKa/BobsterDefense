  drone-list-header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>
<gold><bold>  🛩 FPV-ДРОНИ</bold></gold>
<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"

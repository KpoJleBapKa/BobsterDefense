# ═══════════════════════════════════════════════
#   Стаціонарна автоматична ППО
# ═══════════════════════════════════════════════
#
# Диспенсер із міткою рівня, який сам сканує зону навколо себе і пускає керовані
# палаючі стріли-перехоплювачі по всьому ворожому, що залетіло в радіус.
#
#   ПКМ — інформація, присів+ПКМ — зарядити ракети.
#   Редстоун установку не активує: вона стріляє сама і тільки по цілях.
#
# Зона контролю — ЦИЛІНДР: range — радіус по горизонталі, vertical-range — скільки
# установка дістає вгору і вниз. Тобто range 40 = зона 80×80 блоків заввишки
# 2 × vertical-range. Навмисно небагато: ППО має прикривати базу, а не пів карти.
#
# У кожної установки власна ракета: перехоплювач від NASAMS у Patriot не влізе.
air-defence-system:
  enabled: true
  recipes-enabled: true

  # Зараховувати перехоплення власнику установки в /bobster stats
  count-in-stats: true


  # Плашка над установкою видима лише зблизька.
  # Клієнт множить це на свій повзунок «Entity Distance», тож на 50% зникне вдвічі ближче.
  hologram-distance: 3

  # Блок декоративної башти над установкою (повертається за ціллю)
  turret-block: POLISHED_DEEPSLATE_WALL

  targeting:
    tnt: true
    fpv-drone: true
    ballistic-missile: true
    # false — не стріляти по снарядах власника установки та його сторони (див. teams нижче)
    friendly-fire: false
    elytra-player-damage: 20.0
    # Установка не стріляє крізь гори. Тому ППО має сенс ставити на дахах і баштах.
    require-line-of-sight: true
    # Скільки марних влучань по одній ракеті система робить, перш ніж перейти на інші цілі.
    # Потрібно, щоб слабка ППО не висаджувала весь боєкомплект у ракету, яка їй не по зубах,
    # але й не ігнорувала її демонстративно.
    wasted-shots-per-missile: 2
    # Скільки секунд пам'ятати вердикт по ракеті (політ найдовшої — близько 45 с)
    verdict-ttl-seconds: 180


  interceptor:
    flame-trail: true
    smoke-trail: true
    # Через скільки тіків перехоплювач самознищується, якщо не влучив.
    # Балістику доводиться наздоганяти довго, тому запас чималий.
    lifetime-ticks: 200
    # Радіус влучання. Перехоплювач долає кілька блоків за тік, тому влучання
    # перевіряється по всьому відрізку шляху, а не лише по кінцевій точці.
    hit-distance: 1.0

  ammo:
    # false — установка приймає ТІЛЬКИ свою ракету.
    # true — згодиться будь-яка звичайна стріла (дешево, тому за замовчуванням вимкнено).
    allow-plain-arrows: false

  launcher:
    nasams:
      level: 1
      name: "<gray><bold>🛡 NASAMS air defense</bold></gray>"
      zone-size: 32
      range: 20
      vertical-range: 80
      max-targets: 1
      scan-interval: 4
      fire-cooldown: 300     # один пуск на 15 с
      interceptor-speed: 1.5
      # Шанс упоратися з балістичною ракетою. Кидається ОДИН раз на ракету:
      # серії ні на що не впливають — після десяти збитих одинадцята має ті самі шанси.
      # Дронів і TNT це не стосується взагалі, по них ППО працює як завжди.
      missile-hit-chance: 0.25
      lore:
        - "<dark_gray>Стаціонарна установка ППО."
        - ""
        - "<gray>📡 Зона: <white>{zone}×{zone}</white> блоків"
        - "<gray>🎯 Цілей одночасно: <white>{targets}</white>"
        - "<gray>⏱ Темп: <white>{cooldown}</white>с"
        - ""
        - "<gray>ПКМ — інформація"
        - "<gray>Присів+ПКМ — зарядити"
        - "<red>⚠ Потребує NASAMS rocket"
      ammo:
        name: "<gray><bold>🔥 NASAMS rocket</bold></gray>"
        lore:
          - "<dark_gray>Боєприпас для {launcher}."
          - ""
          - "<gray>Кладеться всередину установки."
          - "<gray>З лука стріляє як звичайна стріла."
        recipe:
          amount: 1
          shape:
            - " A "
            - " G "
            - " R "
          ingredients:
            A: ARROW
            G: GUNPOWDER
            R: REDSTONE
      recipe:
        shape:
          - "IBI"
          - "RDR"
          - "III"
        ingredients:
          I: IRON_INGOT
          B: BLAZE_ROD
          R: REDSTONE_BLOCK
          D: DISPENSER

    patriot:
      level: 2
      name: "<white><bold>🛡 Patriot air defense</bold></white>"
      zone-size: 64
      range: 32
      vertical-range: 120
      max-targets: 2
      scan-interval: 4
      fire-cooldown: 100
      interceptor-speed: 2.5
      missile-hit-chance: 0.5
      lore:
        - "<dark_gray>Посилена установка ППО."
        - ""
        - "<gray>📡 Зона: <white>{zone}×{zone}</white> блоків"
        - "<gray>🎯 Цілей одночасно: <white>{targets}</white>"
        - "<gray>⏱ Темп: <white>{cooldown}</white>с"
        - "<red>⚠ Потребує Patriot rocket"
      ammo:
        name: "<white><bold>🔥 Patriot rocket</bold></white>"
        lore:
          - "<dark_gray>Боєприпас для {launcher}."
          - ""
          - "<gray>Кладеться всередину установки."
        recipe:
          amount: 1
          shape:
            - " I "
            - "GAG"
            - " R "
          ingredients:
            I: IRON_INGOT
            A: ARROW
            G: GUNPOWDER
            R: REDSTONE
      recipe:
        shape:
          - " D "
          - "DAD"
          - " E "
        ingredients:
          D: DIAMOND
          A: "AA:nasams"
          E: ENDER_EYE

    freyja:
      level: 3
      name: "<gold><bold>🛡 FREYJA air defense</bold></gold>"
      zone-size: 96
      range: 48
      vertical-range: 160
      max-targets: 3
      scan-interval: 3
      fire-cooldown: 40      # один пуск на 2 с
      interceptor-speed: 3.5
      missile-hit-chance: 0.8
      lore:
        - "<dark_gray>Важка установка ППО."
        - ""
        - "<gray>📡 Зона: <white>{zone}×{zone}</white> блоків"
        - "<gray>🎯 Цілей одночасно: <white>{targets}</white>"
        - "<gray>⏱ Темп: <white>{cooldown}</white>с"
        - "<red>⚠ Потребує FREYJA rocket"
      ammo:
        name: "<gold><bold>🔥 FREYJA rocket</bold></gold>"
        lore:
          - "<dark_gray>Боєприпас для {launcher}."
          - ""
          - "<gray>Кладеться всередину установки."
        recipe:
          amount: 1
          shape:
            - "GIG"
            - "GAG"
            - " G "
          ingredients:
            I: IRON_INGOT
            A: ARROW
            G: GUNPOWDER
      recipe:
        shape:
          - " E "
          - "NAN"
          - " D "
        ingredients:
          E: ENDER_EYE
          N: NETHERITE_INGOT
          A: "AA:patriot"
          D: DIAMOND_BLOCK

# ═══════════════════════════════════════════════
#   Повітряна тривога (інтеграція з TerritoryMap)
# ═══════════════════════════════════════════════
#
# Замість голих координат тривога оголошується по території, виділеній у TerritoryMap:
# «летить ракета на Solaria». Території читаються прямо з його territories.yml, тож
# BobsterDefence не залежить від збірки TerritoryMap і підхоплює нові території сам.
#
# Тривога вмикається, коли:
#   • балістична ракета летить у точку всередині території;
#   • FPV-дрон опинився ближче за drone-radius до її межі.
# Вимикається сама, коли all-clear-minutes хвилин над територією нічого не літало.
air-raid:
  enabled: true

  # Порожньо = plugins/TerritoryMap/territories.yml поруч із нами.
  # Можна вказати повний шлях, якщо файл лежить деінде.
  territory-file: ""
  # Як часто перевіряти, чи файл територій змінився, секунд
  reload-seconds: 30

  # Скільки хвилин без активності до відбою
  all-clear-minutes: 3

  # На якій відстані від межі території дрон уже вважається загрозою
  drone-radius: 100
  # Запас навколо території для ракети. 0 = тривога лише коли ціль усередині території.
  missile-radius: 0
  # Не вмикати тривогу, якщо снаряд належить власнику території або його коаліції
  skip-friendly: true

  # Раз на скільки секунд перевіряти дрон проти однієї території
  drone-check-seconds: 2

  # Звук сирени всім онлайн при оголошенні тривоги
  siren-sound: true

  discord:
    # Надсилати тривоги в Discord через DiscordSRV, якщо він встановлений
    enabled: true
    # Порожньо = головний канал DiscordSRV. Інакше — ім'я каналу з його config.yml.
    channel: ""

# Сторони. Потрібні, щоб ППО не збивала снаряди своїх.
# Гравці, яких тут немає, вважаються сам за себе: власна ППО не б'є по власних снарядах,

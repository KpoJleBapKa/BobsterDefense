  intercept-missile-actionbar: "<red><bold>🛡 ППО BOBSTER</bold></red> <dark_gray>|</dark_gray> <green><bold>РАКЕТУ ЗБИТО</bold></green> <dark_gray>(<white>{kills}</white>)</dark_gray>"

  # {name}
